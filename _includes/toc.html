{% if page.toc != false %}
  <nav class="toc card soft" aria-label="Contenido">
    <strong>Contenido</strong>
    <ul id="toc-list"></ul>
  </nav>
  <script>
    (function(){
      /* El include va ANTES de {{ content }}, así que al ejecutarse este script
         los h2/h3 del post todavía no existen en el DOM: hay que esperar a que
         termine de parsearse. Antes corría en el acto y el TOC salía vacío. */
      function construir(){
        var list = document.getElementById('toc-list');
        if (!list) return;
        var alcance = document.querySelector('.post .prose') || document.querySelector('.post') || document;
        var headings = alcance.querySelectorAll('h2, h3');
        if (headings.length === 0) {
          var nav = list.closest('.toc');
          if (nav) nav.hidden = true;      /* sin encabezados no mostramos la caja */
          return;
        }
        headings.forEach(function(h){
          if (!h.id) {
            h.id = h.textContent.trim().toLowerCase()
              .normalize('NFD').replace(/[̀-ͯ]/g, '')
              .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
          }
          var li = document.createElement('li');
          li.className = h.tagName.toLowerCase();
          var a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = h.textContent;
          li.appendChild(a);
          list.appendChild(li);
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', construir);
      } else {
        construir();
      }
    })();
  </script>
{% endif %}
