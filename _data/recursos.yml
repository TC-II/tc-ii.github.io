featured_repos:
  - name: "TC2Lib--LTSPICE"
    title: "TCLib para LTSpice"
    desc:  "Librerías de la cátedra para armar y simular circuitos en LTSpice. El repositorio incluye los archivos y las instrucciones de instalación."
    color: "#D42500"
    img:   "/assets/img/repositorios/tc2lib-ltspice.png"

  - name: "TC2Lib--KiCad"
    title: "TCLib para KiCad"
    desc:  "Símbolos y footprints para diseñar esquemáticos y placas en KiCad con los componentes de la cátedra."
    color: "#22c55e"
    img:   "/assets/img/repositorios/tc2lib-kicad.png"

  - name: "TC2-FilterTool"
    online: true
    title: "FilterTool"
    desc:  "Diseño y comparación de filtros."
    color: "#ec4899"
    img:   "/assets/img/repositorios/tc2-filtertool.png"

  - name: "TC2-PlotTool"
    title: "PlotTool"
    desc:  "Herramienta de escritorio para graficar y comparar señales, con código e instrucciones de instalación disponibles en el repositorio."
    color: "#f97316"
    img:   "/assets/img/repositorios/tc2-plottool.png"

  - name: "L2-Recursos-Python"
    title: "Recursos Python"
    desc:  "Colección de ejemplos y utilidades de Python para el procesamiento de mediciones y el análisis de circuitos en las prácticas de laboratorio."
    color: "#38bdf8"
    img:   "/assets/img/repositorios/l2-recursos-python.png"

featured_app:
  title: TurboSpice
  color: '#7aa2f7'
  tagline: Simulador de circuitos tipo LTspice que corre 100% en el navegador.
  desc: Esquemáticos .asc de LTspice, todos los análisis de ngspice y visor de resultados, sin instalar nada.
  url: https://turbospice.pages.dev/TurboSpice/

apps:
  - title: Neandertool
    category: Diseño interactivo
    icon: neander
    color: '#f4cb87'
    desc: Entorno interactivo de diseño de filtros por etapas, con ajuste de respuesta, exploración libre y desafíos de diseño.
    url: https://tc-ii.github.io/neandertool/

  - title: Filter Tool
    category: Análisis de filtros
    icon: filter
    color: '#f3a6cc'
    desc: Herramienta de análisis y comparación de funciones de transferencia, simulaciones y mediciones, con gráficos de respuesta y polos y ceros.
    url: https://tc-ii.github.io/TC2-FilterTool/

  - title: LatexFrog
    category: Editor LaTeX
    icon: latex
    color: '#8fd9a8'
    desc: Editor de LaTeX en el navegador pensado para proyectos grandes, como informes y trabajos prácticos con muchos capítulos.
    url: https://tc-ii.github.io/LatexFrog/

  - title: Plotter racional
    category: Aproximación elíptica
    icon: rational
    color: '#93dfc1'
    desc: Visualizador de la función racional elíptica y del efecto de sus parámetros sobre la respuesta del filtro.
    url: https://tc-ii.github.io/plotter-racional-eliptica-2/

  - title: Calculadora elíptica
    category: Cálculo matemático
    icon: sine
    color: '#99c6ff'
    desc: Calculadora del seno elíptico de Jacobi para el estudio de aproximaciones y filtros elípticos.
    url: https://tc-ii.github.io/plotter-racional-eliptica-2/#sn

  - title: FSK Terminal
    category: Comunicación serie
    icon: fsk
    color: '#b2b3ff'
    desc: Terminal de transmisión y recepción FSK con demodulador PLL. Requiere hardware conectado.
    url: https://tc-ii.github.io/PLL-Tool/
